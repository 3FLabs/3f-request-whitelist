[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 10_000
solc_version = "0.8.24"

[profile.default.fuzz]
runs = 1_000
seed = "0x1"

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
shrink_run_limit = 5_000

# Opt-in "stress" profile for deeper invariant / fuzz runs before a
# release. Activate with `FOUNDRY_PROFILE=stress forge test`.
[profile.stress.fuzz]
runs = 10_000

[profile.stress.invariant]
runs = 1_024
depth = 512
shrink_run_limit = 20_000

# Required because `.github/workflows/ci.yml` sets `FOUNDRY_PROFILE: ci`.
# Foundry 1.6+ rejects unknown profile names with a hard error
# (1.5 silently fell back to default). Empty body — inherits from
# `[profile.default]`; tighten here if CI-specific knobs are wanted.
[profile.ci]

[fmt]
tab_width = 2

[lint]
# Exclusions are deliberate, not blanket noise suppression:
#   mixed-case-function      — handler `h_*` and test constant `ACTION_*` naming is intentional.
#   asm-keccak256            — `keccak256(abi.encode(...))` is the idiomatic EIP-712 pattern;
#                              inlining asm hurts auditability for no measurable gas.
#   unwrapped-modifier-logic — bytecode-size micro-opt; not worth the readability cost on a
#                              one-liner modifier.
#   incorrect-shift          — heuristic that flags the legitimate `1 << n` power-of-2 bitmask
#                              pattern used by nonce bitmaps and call-local dedup.
exclude_lints = [
  "mixed-case-function",
  "asm-keccak256",
  "unwrapped-modifier-logic",
  "incorrect-shift",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
